<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delayed Message App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            border: 2px solid #000;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 15px;
            font-size: 2rem;
        }

        p {
            margin-bottom: 20px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #000;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            color: #000;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #000;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            opacity: 0.85;
        }

        .clear-btn {
            background: #fff;
            color: #000;
            border: 2px solid #000;
        }

        .message-box {
            margin-top: 20px;
            padding: 15px;
            min-height: 70px;
            border: 2px dashed #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-direction: column;
            gap: 10px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 4px solid #d9d9d9;
            border-top: 4px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .status-text {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Delayed Message App</h1>
        <p>Type a message, set a delay in seconds, and display it after waiting.</p>

        <input type="text" id="messageInput" placeholder="Enter your message" />
        <input type="number" id="delayInput" placeholder="Enter delay in seconds" min="1" value="3" />

        <div class="button-group">
            <button id="showMessageBtn">Show Delayed Message</button>
            <button id="clearBtn" class="clear-btn">Clear</button>
        </div>

        <div class="message-box" id="messageBox">
            <div class="spinner" id="spinner"></div>
            <div class="status-text" id="statusText">Your delayed message will appear here.</div>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('messageInput');
        const delayInput = document.getElementById('delayInput');
        const showMessageBtn = document.getElementById('showMessageBtn');
        const clearBtn = document.getElementById('clearBtn');
        const spinner = document.getElementById('spinner');
        const statusText = document.getElementById('statusText');

        function delayMessage(message, delayTime) {
            return new Promise((resolve, reject) => {
                if (message.trim() === '') {
                    reject('Please enter a message first.');
                    return;
                }

                if (delayTime <= 0 || isNaN(delayTime)) {
                    reject('Please enter a valid delay time.');
                    return;
                }

                setTimeout(() => {
                    resolve(message);
                }, delayTime);
            });
        }

        showMessageBtn.addEventListener('click', async () => {
            spinner.style.display = 'block';
            statusText.textContent = 'Waiting...';

            try {
                const message = messageInput.value;
                const delayTime = Number(delayInput.value) * 1000;
                const result = await delayMessage(message, delayTime);
                statusText.textContent = result;
            } catch (error) {
                statusText.textContent = error;
            } finally {
                spinner.style.display = 'none';
            }
        });

        clearBtn.addEventListener('click', () => {
            messageInput.value = '';
            delayInput.value = '3';
            spinner.style.display = 'none';
            statusText.textContent = 'Your delayed message will appear here.';
        });
    </script>
</body>

</html>
