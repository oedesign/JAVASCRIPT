<body>
  <!-- Age Checker -->
  <form action="">
    <label for="age">Age:</label>
    <input id="age" type="text">
    <input type="submit" value="submit" id="submit">
  </form>
    <p id="populate"></p>

    <!-- Grade Checker -->
     <form action="">

      <input type="submit" value="submit" id="submit">
     </form>

  <script>
    // Age Checker
    const submit = document.getElementById('submit');
    submit.addEventListener('click', (event)=> {
      event.preventDefault();
      const age = document.getElementById('age').value;
      if (age >= 18 && age < 35) {
         document.getElementById('populate').textContent = 'Welcome to the club';
      } else if (age >= 35) {
        document.getElementById('populate').textContent = 'You are too old to enter';
      } else {
        document.getElementById('populate').textContent = 'You are not old enough to enter'; 
      }
    });

      if (grade >=90 && grade <= 100) {

      }

</body>
