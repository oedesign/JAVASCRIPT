<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple calculator logic</title>
</head>
<style>
  .calculator-container {
    width: 400px;
    height: 500px;
    margin: 0 auto;
    border: 1px solid black;
    background-color: rgb(39, 37, 37);
    position: relative;
  }
  .screen {
    width: 350px;
    height: 100px;
    position: absolute;
    left: 25px;
    top: 20px;
    border: 1px solid black;
    background-color: whitesmoke;
  }
</style>
<body>
  <main>
    <div class="calculator-container">
      <div class="screen"></div>
    </div>
  </main>
</body>
</html>
