<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple calculator logic</title>
  </head>
<style>
 .container {
  margin: 0 auto;
  border: 1px solid black;
  max-width: 400px;
  height: 500px;
  position: relative;
 }
 #screen {
  position: absolute;
  border: 2px solid black;
  top: 10px;
  width: 350px;
  left: 25px;
  height: 80px;
  background-color: lightgray;
 }
 #numbers div {
  position: relative;
  top: 100px;
  left: 30px;
 }
 #numbers {
  display: flex;
  column-gap: 100px;
  row-gap: 20px;
  flex-wrap: wrap;
  margin-top: 25px;
 }
</style>
<body>
 <main>
  <div class="container">
     <section id="screen"></section>
     <section id="numbers">
      <div class="1">1</div>
      <div class="2">2</div>
      <div class="3">3</div>
      <div class="plus">+</div>
      <div class="4">4</div>
      <div class="5">5</div>
      <div class="6">6</div>
      <div class="minus">-</div>
      <div class="7">7</div>
      <div class="8">8</div>
      <div class="9">9</div>
      <div class="times">*</div>
      <div class="0">0</div>
     </section>
  </div>
 </main>
<script>

</script>
</body>

</html>
